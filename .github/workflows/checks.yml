name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 核心依赖只用标准库；未装 PyMuPDF/fsrs/sympy 时相关检查显式 SKIP，装齐依赖的覆盖由 full-deps job 保证。
      - name: npm pack smoke
        run: |
          node npm/bin/study-coach.js --version
          npm pack --dry-run

      - name: Acceptance checks
        run: python scripts/run_checks.py --skill-root .

      - name: Acceptance checks with template KB
        run: python scripts/run_checks.py --skill-root . --kb 知识库模板

      - name: Routing eval
        run: python scripts/route.py --eval evals/routing.jsonl --json

  # 唯一装可选依赖的 job：把 PyMuPDF / fsrs / SymPy 分支从 SKIP 变成真实执行
  full-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional dependencies
        run: python -m pip install --upgrade pip fsrs sympy pymupdf

      - name: Acceptance checks with optional dependencies
        run: python scripts/run_checks.py --skill-root . --kb 知识库模板
